name: Android build and release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle test --no-daemon
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Verify release APK
        run: test -s app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: abb-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      # Stable pushes publish automatically using the ephemeral runner debug key.
      - name: Publish tagged APK
        if: github.ref == "refs/heads/stable"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026.11.10.1708-run-${{ github.run_number }}
          name: ABB 2026.11.10.1708 (run ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/app-release.apk
